<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Szk SENSI Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent; /* Fundo transparente para o OBS */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial Black', sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Reta de auxílio - Ajustada para não passar da cabeça */
        .line-aim {
            width: 3px;
            height: 35px;
            background: linear-gradient(to bottom, #ff004c, #7000ff);
            border-radius: 2px;
            margin-bottom: 8px;
            box-shadow: 0 0 10px rgba(255, 0, 76, 0.6);
        }

        /* Box de Informações */
        .info-card {
            background: rgba(10, 10, 10, 0.85);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .main-name {
            color: #ffffff;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
            text-shadow: 2px 2px 0px #ff004c;
        }

        .tiktok-link {
            color: #00f2ea; /* Cor clássica do TikTok */
            font-size: 12px;
            margin-top: 5px;
            font-weight: bold;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        /* Pequeno detalhe estético nas bordas */
        .info-card::before {
            content: '';
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff004c, transparent);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="line-aim"></div>

        <div class="info-card">
            <h1 class="main-name">Szk SENSI</h1>
            <div class="tiktok-link">@_dvszk</div>
        </div>
    </div>

</body>
</html>
